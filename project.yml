name: DeusKVM
options:
  bundleIdPrefix: io.github.amadeus
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: UHD99KF9X7
    MARKETING_VERSION: "0.0.4"
    CURRENT_PROJECT_VERSION: "4"

targets:
  DeusKVM:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: DeusKVM
        excludes:
          - entitlements.plist
      - path: DeusKVM/entitlements.plist
        buildPhase: none
    resources:
      - DeusKVM/Assets.xcassets
      - DeusKVM/PrivacyInfo.xcprivacy
      - DeusKVM/Resources/company_ids.json
      - DeusKVM/Resources/service_uuids.json
    settings:
      base:
        PRODUCT_NAME: DeusKVM
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: io.github.amadeus.deuskvm
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DeusKVM/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": DeusKVM/entitlements.plist
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
  DeusKVMTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DeusKVMTests
      - DeusKVM/LowEnergy/HIDReports.swift
      - DeusKVM/LowEnergy/HIDNotificationQueue.swift
      - DeusKVM/LowEnergy/HIDProfile.swift
      - DeusKVM/DirectInputEvent.swift
      - DeusKVM/MacKeyboardMapping.swift
      - DeusKVM/RawKeyboardState.swift
      - DeusKVM/MediaKeyEvent.swift
      - DeusKVM/DirectInputController.swift
      - DeusKVM/AppSettings.swift
      - DeusKVM/DeviceNameStore.swift
      - DeusKVM/HIDInputValue.swift
      - DeusKVM/EdgeGeometry.swift
      - DeusKVM/ReturnMotionProbe.swift
      - DeusKVM/HandoffState.swift
      - DeusKVM/TapRunState.swift
      - DeusKVM/HIDHostPolicy.swift
      - DeusKVM/StatusBarConnectionState.swift
      - DeusKVM/CaptureReadiness.swift
      - DeusKVM/Companion/CompanionProtocol.swift
      - DeusKVM/Companion/CompanionSelection.swift
      - DeusKVM/Clipboard/ClipboardFile.swift
      - DeusKVM/Clipboard/ClipboardTransfer.swift
      - DeusKVM/Clipboard/ClipboardRevision.swift
      - DeusKVM/Clipboard/ClipboardPasteboard.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.amadeus.deuskvm.tests
schemes:
  DeusKVM:
    build:
      targets:
        DeusKVM: all
    test:
      targets:
        - DeusKVMTests
    run:
      config: Debug
    archive:
      config: Release
